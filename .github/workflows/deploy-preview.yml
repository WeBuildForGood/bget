name: Deploy Preview

on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview Worker
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers (preview)
        id: deploy-preview
        run: |
          set -o pipefail
          # Create preview worker using wrangler deploy --env preview
          OUTPUT=$(npx wrangler deploy --env preview 2>&1)
          echo "$OUTPUT"
          echo "PREVIEW_OUTPUT=$OUTPUT" >> $GITHUB_ENV
          # Extract preview URL
          if echo "$OUTPUT" | grep -oE 'https://[^ ]+'; then
            URL=$(echo "$OUTPUT" | grep -oE 'https://[^ ]+' | head -n1)
            echo "preview-url=$URL" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Post preview comment on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy-preview.outputs.preview-url }}' || 'https://preview.buildforgood.workers.dev';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployment**\n\nPreview URL: ${previewUrl}\n\nCreated with \`wrangler deploy --env preview\`. Health check performed after deploy.`
            });
