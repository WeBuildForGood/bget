name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NOTE: Keep the exact job id `test` and name `Test` — branch protection requires this check name.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (Next.js & Cloudflare Worker)
        run: npm run typecheck

      - name: Unit tests (node --test)
        run: npm test

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://buildforgood.world"

      - name: Verify static export
        run: |
          test -f out/index.html || (echo "Static export missing out/index.html" && exit 1)
          test -f out/404.html || (echo "Static export missing out/404.html" && exit 1)
          echo "Static export OK: $(find out -type f | wc -l) files generated."
