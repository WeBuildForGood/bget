# Rollback mechanism: If a deployment fails health check, revert using previous
# worker version via wrangler rollback or redeploy previous commit.
# Steps: 1) Find last known good commit. 2) Run npx wrangler deploy from that tag.
# For production, use `wrangler deploy --env production --tag <previous>`.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run type-check
        run: npm run typecheck
      
      - name: Run unit tests
        run: npm test
      
      - name: Security audit
        run: npm audit --audit-level=moderate
      
      - name: Build
        run: |
          set -e
          START_TIME=$(date +%s)
          npm run build
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "BUILD_TIME=${BUILD_TIME}s" >> $GITHUB_ENV
          echo "Build completed in ${BUILD_TIME}s"
          # Count assets and gzip stats
          if [ -d "out" ]; then
            ASSET_COUNT=$(find out -type f | wc -l)
            TOTAL_SIZE=$(du -sh out | cut -f1)
            echo "ASSET_COUNT=${ASSET_COUNT}" >> $GITHUB_ENV
            echo "TOTAL_SIZE=${TOTAL_SIZE}" >> $GITHUB_ENV
            # Gzip stats for top 10 files
            echo "=== Gzip compression stats ==="
            find out -type f -name "*.js" -o -name "*.css" -o -name "*.html" -o -name "*.json" | head -20 | while read f; do
              ORIG=$(stat -c%s "$f")
              GZIP=$(gzip -c "$f" | wc -c)
              RATIO=$(echo "scale=1; $GZIP*100/$ORIG" | bc 2>/dev/null || echo "N/A")
              echo "$f: ${ORIG}B -> ${GZIP}B (${RATIO}%)"
            done
          fi
      
      - name: Verify static export
        run: |
          # `npm run build` is a Next.js static export to `out/` (see
          # next.config.mjs). The API is served by the Worker, not the export,
          # so we smoke-test the emitted artifact instead of a local server.
          test -f out/index.html || (echo "Static export missing out/index.html" && exit 1)
          test -f out/404.html || (echo "Static export missing out/404.html" && exit 1)
          echo "Static export OK: $(find out -type f | wc -l) files"
      
  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: |
          set -e
          START_TIME=$(date +%s)
          npm run build
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "Build completed in ${BUILD_TIME}s"
          # Asset stats
          if [ -d "out" ]; then
            ASSET_COUNT=$(find out -type f | wc -l)
            TOTAL_SIZE=$(du -sh out | cut -f1)
            echo "Assets: ${ASSET_COUNT} files, ${TOTAL_SIZE} total"
          fi
      
      - name: Deploy to Cloudflare Workers (production)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      
      - name: Post-deploy health check
        run: |
          # Canonical production origin (custom domain configured in
          # wrangler.toml). Retry briefly to allow DNS/edge propagation.
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://buildforgood.world/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed" && exit 1

      - name: Smoke test (production)
        run: |
          set -e
          HOME_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://buildforgood.world/)
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://buildforgood.world/api/health)
          echo "GET /            -> ${HOME_CODE}"
          echo "GET /api/health  -> ${HEALTH_CODE}"
          test "${HOME_CODE}" = "200"
          test "${HEALTH_CODE}" = "200"
          echo "Smoke test passed"
      
  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: |
      vars.ENABLE_PREVIEW_DEPLOY == 'true' && (
        github.ref == 'refs/heads/staging' ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: |
          set -e
          START_TIME=$(date +%s)
          npm run build
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "Build completed in ${BUILD_TIME}s"
          if [ -d "out" ]; then
            ASSET_COUNT=$(find out -type f | wc -l)
            TOTAL_SIZE=$(du -sh out | cut -f1)
            echo "Assets: ${ASSET_COUNT} files, ${TOTAL_SIZE} total"
          fi
      
      - name: Deploy to Cloudflare Workers (staging)
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # NOTE: No post-deploy health check for staging. The previously
      # referenced `*.workers.dev` host returns 404 and no staging worker URL
      # can be verified, so we do not point CI at a URL that may not exist.
      # Add a check here once a stable staging hostname is known (and after
      # `[env.staging]` is defined in wrangler.toml).
  
  deploy-preview:
    name: Deploy Preview
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.ENABLE_PREVIEW_DEPLOY == 'true'
    environment: preview
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: |
          set -e
          START_TIME=$(date +%s)
          npm run build
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "Build completed in ${BUILD_TIME}s"
          if [ -d "out" ]; then
            ASSET_COUNT=$(find out -type f | wc -l)
            TOTAL_SIZE=$(du -sh out | cut -f1)
            echo "Assets: ${ASSET_COUNT} files, ${TOTAL_SIZE} total"
          fi
      
      - name: Deploy to Cloudflare Workers (preview)
        id: deploy-preview
        run: |
          set -o pipefail
          OUTPUT=$(npx wrangler deploy --env preview 2>&1)
          echo "$OUTPUT"
          # Extract the (first) preview URL from wrangler output. `head -n1`
          # guards against multiple matches turning URL into a multi-line value,
          # which would corrupt both $GITHUB_OUTPUT and the curl below.
          if echo "$OUTPUT" | grep -q "https://"; then
            URL=$(echo "$OUTPUT" | grep -oE 'https://[^ ]+' | head -n1)
          else
            echo "Could not determine the preview URL from wrangler output" && exit 1
          fi
          echo "preview-url=$URL" >> "$GITHUB_OUTPUT"
          # Check preview health
          curl -f "$URL/api/health" || (echo "Preview health check failed" && exit 1)
        
      - name: Post preview link on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy-preview.outputs.preview-url }}'
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployment**\n\nPreview URL: ${previewUrl}\n\nThis preview was deployed from pull request #${context.issue.number}. Deployed by GitHub Actions.\n\n✅ Health check passed`
            })