name: CI/CD Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build & Gate Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type-check (Next.js & Worker)
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build static export
        run: |
          set -e
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            export NEXT_PUBLIC_SITE_URL="https://buildforgood.world"
          else
            export NEXT_PUBLIC_SITE_URL="https://staging.buildforgood.world"
          fi
          echo "Building static export for site URL: $NEXT_PUBLIC_SITE_URL"
          npm run build
        env:
          NODE_ENV: production

      - name: Verify static export
        run: |
          test -f out/index.html || (echo "Missing out/index.html" && exit 1)
          test -f out/404.html || (echo "Missing out/404.html" && exit 1)
          echo "Static export verified: $(find out -type f | wc -l) files"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: out/
          retention-days: 3

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-out
          path: out

      - name: Deploy to Cloudflare Workers (production)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Post-deploy health check
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://buildforgood.world/api/health; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done
          echo "Production health check failed" && exit 1

      - name: Smoke test
        run: |
          set -e
          HOME_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://buildforgood.world/)
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://buildforgood.world/api/health)
          echo "GET /           -> ${HOME_CODE}"
          echo "GET /api/health -> ${HEALTH_CODE}"
          test "${HOME_CODE}" = "200"
          test "${HEALTH_CODE}" = "200"
          echo "Smoke test passed"

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-out
          path: out

      - name: Deploy to Cloudflare Workers (staging)
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Verify staging access gate
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          URL="https://staging.buildforgood.world/api/health"
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" "$URL" || true)
            echo "authenticated request -> ${code}"
            test "${code}" = "200"
          else
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
            echo "anonymous request -> ${code}"
            if [ "${code}" = "200" ]; then
              echo "::error::staging is publicly reachable; Cloudflare Access is not protecting it."
              exit 1
            fi
            case "${code}" in
              301|302|303|307|308|401|403) echo "Access gate present." ;;
              *) echo "::error::unexpected staging response ${code}"; exit 1 ;;
            esac
          fi
