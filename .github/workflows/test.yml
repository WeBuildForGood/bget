name: CI Tests

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run unit tests (node --test)
        run: npm test

      - name: Run type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Security audit (npm audit --audit-level=moderate)
        run: npm audit --audit-level=moderate

      - name: Dependency scan (npm outdated / audit)
        run: |
          echo "Dependency scan: checking for vulnerable/outdated packages"
          npm audit --audit-level=moderate || true
          npm outdated || true

      - name: Security scan (Trivy filesystem scan)
        run: |
          echo "Running Trivy security scan..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin || true
          trivy fs . --severity HIGH,CRITICAL --exit-code 0 || echo "Trivy scan completed"

      - name: Smoke test (static export)
        run: |
          # The Next.js static export is the deployable artifact. The /api/*
          # routes are served by the Worker, so a PR-time check validates the
          # build output instead of depending on a remote deployment.
          test -f out/index.html || (echo "Missing out/index.html" && exit 1)
          test -f out/404.html || (echo "Missing out/404.html" && exit 1)
          echo "Static export OK: $(find out -type f | wc -l) files"
