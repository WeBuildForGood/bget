name: CI Tests

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type-check (tsc --noEmit)
        run: npx tsc --noEmit --incremental false

      - name: Build
        run: npm run build

      - name: Security audit (npm audit --audit-level=moderate)
        run: npm audit --audit-level=moderate

      - name: Dependency scan (npm outdated / audit)
        run: |
          echo "Dependency scan: checking for vulnerable/outdated packages"
          npm audit --audit-level=moderate || true
          npm outdated || true

      - name: Security scan (Trivy filesystem scan)
        run: |
          echo "Running Trivy security scan..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin || true
          trivy fs . --severity HIGH,CRITICAL --exit-code 0 || echo "Trivy scan completed"

      - name: Health-check endpoint test
        run: |
          # Verify deployed URL responds with 200
          curl -s -o /dev/null -w "%{http_code}" https://buildforgood.nikhilnagpure203.workers.dev/api/health | grep -q "200" || echo "Warning: health endpoint not available in this environment"
